<!-- Language Switch: single flag button, click to toggle language. Flag shown = current language. -->
{% set current_lang = session.get('lang', 'vi') %}
<a href="{{ '/set-language/en' if current_lang == 'vi' else '/set-language/vi' }}"
    class="inline-flex items-center justify-center w-9 h-9 rounded-full bg-white border border-slate-200 shadow-sm hover:shadow-md hover:scale-105 transition-all"
    title="{{ 'Switch to English' if current_lang == 'vi' else 'Chuyển sang tiếng Việt' }}">
    <img src="{{ url_for('static', filename='images/flags/vn.svg' if current_lang == 'vi' else 'images/flags/us.svg') }}" alt="{{ 'VN' if current_lang == 'vi' else 'US' }}" class="w-5 h-[15px] object-contain">
</a>
