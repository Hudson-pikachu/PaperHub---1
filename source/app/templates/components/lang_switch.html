<!-- Language Switch: click 🇻🇳 → English, click 🇺🇸 → Vietnamese -->
{% set current_lang = session.get('lang', 'vi') %}
<div class="inline-flex items-center rounded-full bg-white border border-slate-200 p-0.5 gap-0.5">
    <a href="/set-language/en"
        class="flex items-center justify-center w-8 h-8 rounded-full transition-all {{ 'bg-[#1A365D] shadow-sm scale-110' if current_lang == 'en' else 'opacity-40 hover:opacity-70' }}">
        <span class="text-base leading-none">🇻🇳</span>
    </a>
    <a href="/set-language/vi"
        class="flex items-center justify-center w-8 h-8 rounded-full transition-all {{ 'bg-[#1A365D] shadow-sm scale-110' if current_lang == 'vi' else 'opacity-40 hover:opacity-70' }}">
        <span class="text-base leading-none">🇺🇸</span>
    </a>
</div>
