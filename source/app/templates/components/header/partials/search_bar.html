<div class="{{ wrapper_class | default('') }}">
    <div class="search-form relative">

        <!-- Search Icon -->
        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        </div>

        <!-- Input -->
        <input type="text" data-search-input
            placeholder="{{ 'Search research papers...' if session.get('lang', 'vi') == 'en' else 'Tìm kiếm bài nghiên cứu...' }}"
            class="{{ input_class }}">

        <!-- Dropdown -->
        <div class="search-dropdown hidden absolute z-50 left-0 right-0 mt-2
                    bg-white/95 backdrop-blur-md
                    border border-slate-200
                    rounded-2xl
                    shadow-xl
                    max-h-[60vh]
                    overflow-y-auto">
        </div>

    </div>
</div>
