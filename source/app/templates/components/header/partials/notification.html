<div class="relative">
    <!-- Button Notification Bell -->
    <button id="notif-bell-btn"
        class="relative w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-500 hover:text-[#1A365D] hover:border-slate-300 hover:shadow-sm transition-all">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>

        <!-- Notification Dot -->
        <span id="notif-dot"
            class="absolute top-2 right-2 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white hidden"></span>
    </button>

    <!-- Dropdown -->
    <div id="notif-dropdown"
        class="hidden absolute z-40 sm:right-0 right-[-70px] z-50 mt-3 w-[calc(100vw-2rem)] sm:w-96 max-w-[380px] max-h-[70vh] overflow-y-auto bg-white/95 backdrop-blur-md border border-slate-200 rounded-2xl shadow-xl">
        <!-- Header -->
        <div class="px-5 py-3 border-b border-slate-100 flex items-center justify-between">
            <h3 class="text-sm font-semibold text-[#1A365D]">
                {{ 'Notifications' if session.get('lang', 'vi') == 'en' else 'Thông báo' }}
            </h3>
            <div class="flex items-center gap-3">
                <button id="mark-all-read-btn"
                    class="hidden text-[10px] text-[#1A365D] hover:text-[#2C5282] underline transition-colors"
                    title="{{ 'Mark all as read' if session.get('lang', 'vi') == 'en' else 'Đánh dấu tất cả đã xem' }}">
                    {{ 'Mark all read' if session.get('lang', 'vi') == 'en' else 'Xóa tất cả' }}
                </button>
                <span id="notif-count-text" class="text-xs text-slate-400">
                    {{ '0 new papers' if session.get('lang', 'vi') == 'en' else '0 nghiên cứu mới' }}
                </span>
            </div>
        </div>

        <!-- List -->
        <div id="notif-list" class="divide-y divide-slate-100">
            <div class="px-5 py-8 text-center text-sm text-slate-400">
                {{ 'Loading...' if session.get('lang', 'vi') == 'en' else 'Đang tải...' }}
            </div>
        </div>
    </div>
</div>
