<header class="sticky top-0 z-50 bg-[#F1F5F9]/80 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 md:px-6 py-3">
        <!-- HEADER LAYOUT -->
        <div class="flex flex-col gap-3">
            <!-- TOP ROW -->
            <div class="flex items-center justify-between gap-4">
                <!-- Logo -->
                <a href="/" class="shrink-0">
                    <img src="{{ url_for('static', filename='images/logo/logo.png') }}" alt="PaperHub Logo"
                        class="h-10 md:h-14 w-auto object-contain">
                </a>

                <!-- DESKTOP SEARCH -->
                <div class="hidden lg:block flex-1 max-w-2xl">
                    <div class="search-form relative">
                        <!-- Search Icon -->
                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-400" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>

                        <!-- Search Input -->
                        <input type="text" data-search-input
                            placeholder="{{ 'Search research papers...' if session.get('lang', 'vi') == 'en' else 'Tìm kiếm bài nghiên cứu...' }}"
                            class="w-full bg-white border border-slate-200 rounded-full py-2.5 pl-12 pr-4 text-sm md:text-base shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">

                        <!-- Search Dropdown -->
                        <div
                            class="search-dropdown hidden absolute z-50 left-0 right-0 mt-2 bg-white/95 backdrop-blur-md border border-slate-200 rounded-2xl shadow-xl max-h-[60vh] overflow-y-auto">
                        </div>
                    </div>
                </div>

                <!-- RIGHT ACTIONS -->
                <div class="flex items-center gap-3 shrink-0">
                    <!-- Desktop Button -->
                    <div class="hidden lg:flex items-center gap-3">
                        <!-- Language Switch -->
                        {% include 'components/header/partials/lang_switch.html' %}
                        <!-- Login -->
                        <button id="open-login-modal"
                            class="px-4 py-2 bg-[#1A365D] text-white text-sm font-semibold rounded-full shadow-sm hover:bg-[#2C5282] transition-all">
                            {{ 'Login' if session.get('lang', 'vi') == 'en' else 'Đăng nhập' }}
                        </button>

                    </div>

                    <!-- Mobile: Language Switch + Login -->
                    <div class="lg:hidden flex items-center gap-2">
                        {% include 'components/lang_switch.html' %}
                        <button id="mobile-open-login-modal"
                            class="px-4 py-2 bg-[#1A365D] text-white text-sm font-semibold rounded-full shadow-sm hover:bg-[#2C5282] transition-all">
                            {{ 'Login' if session.get('lang', 'vi') == 'en' else 'Đăng nhập' }}
                        </button>
                    </div>
                </div>
            </div>

            <!-- MOBILE SEARCH -->
            <div class="lg:hidden">
                <div class="search-form relative">
                    <!-- Search Icon -->
                    <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-400" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>

                    <!-- Search Input -->
                    <input type="text" data-search-input
                        placeholder="{{ 'Search research papers...' if session.get('lang', 'vi') == 'en' else 'Tìm kiếm bài nghiên cứu...' }}"
                        class="w-full bg-white border border-slate-200 rounded-full py-2 pl-12 pr-4 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">

                    <!-- Search Dropdown -->
                    <div
                        class="search-dropdown hidden absolute z-50 left-0 right-0 mt-2 bg-white/95 backdrop-blur-md border border-slate-200 rounded-2xl shadow-xl max-h-[60vh] overflow-y-auto">
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Hiện login modal box -->
<script>
    const mobileLoginBtn = document.getElementById('mobile-open-login-modal');

    if (mobileLoginBtn) {

        mobileLoginBtn.addEventListener('click', () => {

            // Ẩn gate message nếu có (reset từ lần trước)
            const gateMsg = document.getElementById('login-gate-message');
            if (gateMsg) {
                gateMsg.classList.add('hidden');
            }

            loginModal.classList.remove('hidden');
            loginModal.classList.add('flex');

        });

    }
</script>

<!-- Login Modal -->
{% include 'components/auth/login_modal.html' %}

<!-- Register Modal -->
{% include 'components/auth/register_modal.html' %}
