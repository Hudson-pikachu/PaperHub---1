<header class="sticky top-0 z-50 bg-[#F1F5F9]/80 backdrop-blur-md">
    <div class="max-w-5xl mx-auto px-4 md:px-6 py-3">
        <!-- MOBILE + DESKTOP LAYOUT -->
        <div class="flex flex-col gap-3">
            <!-- TOP ROW -->
            <div class="flex items-center justify-between gap-4">
                <!-- Logo -->
                <a href="/" class="shrink-0">
                    <img src="{{ url_for('static', filename='images/logo/logo.png') }}" alt="PaperHub Logo"
                        class="h-10 md:h-14 w-auto object-contain">
                </a>

                <!-- DESKTOP SEARCH -->
                <div class="hidden lg:block flex-1 max-w-2xl">
                    <div class="relative">
                        <!-- Search Icon -->
                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-400" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>
                        <!-- Input -->
                        <input type="text" placeholder="Tìm kiếm bài nghiên cứu..."
                            class="w-full bg-white border border-slate-200 rounded-full py-2.5 pl-12 pr-4 text-sm md:text-base shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                    </div>
                </div>

                <!-- RIGHT ACTIONS -->
                <div class="flex items-center gap-3 shrink-0">
                    <!-- Notification Bell + Dropdown -->
                    <div class="relative">
                        <button id="notif-bell-btn"
                            class="relative w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-500 hover:text-[#1A365D] hover:border-slate-300 hover:shadow-sm transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                            </svg>
                            <!-- Notification Dot -->
                            <span id="notif-dot"
                                class="absolute top-2 right-2 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white hidden"></span>
                        </button>

                        <!-- Dropdown -->
                        <div id="notif-dropdown" class="hidden absolute z-40 sm:right-0 right-[-70px] z-50 mt-3
                                w-[calc(100vw-2rem)] sm:w-96
                                max-w-[380px]
                                max-h-[70vh]
                                overflow-y-auto
                                bg-white/95 backdrop-blur-md
                                border border-slate-200
                                rounded-2xl
                                shadow-xl">
                            <!-- Header -->
                            <div class="px-5 py-3 border-b border-slate-100 flex items-center justify-between">
                                <h3 class="text-sm font-semibold text-[#1A365D]">
                                    Thông báo
                                </h3>
                                <span id="notif-count-text" class="text-xs text-slate-400">
                                    0 bài viết mới
                                </span>
                            </div>

                            <!-- List -->
                            <div id="notif-list" class="divide-y divide-slate-100">
                                <div class="px-5 py-8 text-center text-sm text-slate-400">
                                    Đang tải...
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- USER -->
                    <div class="flex items-center gap-3">
                        <!-- Desktop User Info -->
                        <div class="hidden lg:block text-right max-w-[160px]">
                            <p class="text-base font-semibold text-[#1A365D] truncate">
                                {{ current_user.username }}
                            </p>
                            <p class="text-sm text-slate-500 truncate">
                                {{ current_user.email }}
                            </p>
                        </div>

                        <!-- User Dropdown -->
                        <div class="relative">
                            <button id="user-menu-btn"
                                class="w-11 h-11 rounded-full bg-[#1A365D] text-white flex items-center justify-center text-lg font-bold shadow-sm hover:bg-[#2C5282] transition-all">
                                {{ current_user.initials }}
                            </button>

                            <!-- Dropdown -->
                            <div id="user-dropdown"
                                class="hidden absolute right-0 z-[60] mt-3 w-48 bg-white border border-slate-200 rounded-2xl shadow-lg overflow-hidden">
                                <a href="/profile"
                                    class="block px-5 py-3 text-sm text-slate-700 hover:bg-slate-50 transition-colors">
                                    Profile
                                </a>
                                <a href="{{ url_for('auth.logout') }}"
                                    class="block px-5 py-3 text-sm text-red-500 border-t border-slate-100 hover:bg-red-50 transition-colors">
                                    Đăng xuất
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- MOBILE SEARCH -->
            <div class="lg:hidden">
                <div class="relative">
                    <!-- Search Icon -->
                    <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-400" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <!-- Input -->
                    <input type="text" placeholder="Tìm kiếm bài nghiên cứu..."
                        class="w-full bg-white border border-slate-200 rounded-full py-2 pl-12 pr-4 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Notification Bell JS -->
<script>
    (function () {
        const bellBtn = document.getElementById('notif-bell-btn');
        const dropdown = document.getElementById('notif-dropdown');
        const notifList = document.getElementById('notif-list');
        const notifDot = document.getElementById('notif-dot');
        const notifCountText = document.getElementById('notif-count-text');
        const userBtn = document.getElementById('user-menu-btn');
        const userDropdown = document.getElementById('user-dropdown');

        const hasNotifDropdown = bellBtn && dropdown && notifList;
        const hasUserDropdown = userBtn && userDropdown;

        let isOpen = false;
        let hasLoaded = false;
        let isUserOpen = false;

        // ── Load badge count ngay khi trang load ──
        (async function initBadge() {
            try {
                const resp = await fetch('/unread-count');
                const data = await resp.json();
                if (data.success) {
                    updateBadge(data.unread_count || 0);
                }
            } catch (e) {
                // silently fail
            }
        })();

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function updateBadge(count) {
            if (notifCountText) {
                notifCountText.textContent =
                    count === 0
                        ? 'Không có bài viết mới'
                        : `${count} bài viết mới`;
            }

            if (!notifDot) return;
            if (count > 0) {
                notifDot.classList.remove('hidden');
                notifDot.textContent = count > 99 ? '99+' : count;
                notifDot.classList.add('flex', 'items-center', 'justify-center', 'text-[9px]', 'font-bold', 'text-white', 'leading-none');
                notifDot.style.minWidth = count > 9 ? '18px' : '16px';
                notifDot.style.height = count > 9 ? '18px' : '16px';
                notifDot.style.top = '-2px';
                notifDot.style.right = '-4px';
                notifDot.style.padding = '0 2px';
            } else {
                notifDot.classList.add('hidden');
                notifDot.textContent = '';
                notifDot.classList.remove('flex', 'items-center', 'justify-center');
                notifDot.style = '';
            }
        }

        async function loadNotifications() {
            if (hasLoaded) return;
            try {
                const resp = await fetch('/new-papers');
                const data = await resp.json();
                const papers = data.papers || [];
                const count = data.count || 0;

                updateBadge(count);

                if (papers.length === 0) {
                    notifList.innerHTML = '<div class="px-5 py-8 text-center text-sm text-slate-400">Chưa có bài nghiên cứu mới.</div>';
                } else {
                    notifList.innerHTML = papers.map(function (p) {
                        return `
                    <a href="/read/${p.id}" class="notif-item block px-5 py-4 hover:bg-slate-50 transition-colors" data-paper-id="${p.id}">
                        <p class="text-sm leading-snug">
                            <span class="text-[9px] bg-[#1A365D] text-white px-1.5 py-[2px] rounded-full font-semibold mr-2">${escapeHtml(p.category)}</span>
                            <span class="font-semibold text-[#1A365D]">${escapeHtml(p.title.length > 60 ? p.title.substring(0, 60) + '...' : p.title)}</span>
                        </p>
                        <p class="text-xs text-slate-400 mt-1">${formatDate(p.published_date)}</p>
                    </a>`;
                    }).join('');

                    // Mark paper as read when clicked
                    notifList.querySelectorAll('.notif-item').forEach(function (item) {
                        item.addEventListener('click', function (e) {
                            const paperId = parseInt(item.getAttribute('data-paper-id'));
                            if (paperId) {
                                fetch('/mark-paper-read', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ paper_id: paperId })
                                }).then(function (r) { return r.json(); })
                                    .then(function (d) {
                                        if (d.success) {
                                            updateBadge(d.unread_count || 0);
                                            // Remove item with animation
                                            item.style.transition = 'opacity 0.3s';
                                            item.style.opacity = '0';
                                            setTimeout(function () { item.remove(); }, 300);
                                        }
                                    })
                                    .catch(function () { });
                            }
                        });
                    });
                }
                hasLoaded = true;
            } catch (err) {
                notifList.innerHTML = '<div class="px-5 py-8 text-center text-sm text-red-400">Lỗi tải thông báo.</div>';
            }
        }

        function openDropdown() {

            if (!hasNotifDropdown) return;

            // chỉ đóng user dropdown nếu đang mở
            if (isUserOpen) {
                closeUserDropdown();
            }

            dropdown.classList.remove('hidden');
            isOpen = true;
            loadNotifications();
        }

        function closeDropdown() {

            if (!hasNotifDropdown) return;

            dropdown.classList.add('hidden');
            isOpen = false;
        }

        function openUserDropdown() {

            if (!hasUserDropdown) return;

            // chỉ đóng notification nếu đang mở
            if (isOpen) {
                closeDropdown();
            }

            // delay 1 frame để browser render xong
            requestAnimationFrame(() => {
                userDropdown.classList.remove('hidden');
                isUserOpen = true;
            });
        }

        function closeUserDropdown() {

            if (!hasUserDropdown) return;

            userDropdown.classList.add('hidden');
            isUserOpen = false;
        }

        if (hasNotifDropdown) {

            bellBtn.addEventListener('click', function (e) {
                e.stopPropagation();

                if (isUserOpen) {
                    closeUserDropdown();
                }

                if (isOpen) {
                    closeDropdown();
                } else {
                    openDropdown();
                }
            });
        }

        if (hasUserDropdown) {

            userBtn.addEventListener('click', function (e) {
                e.stopPropagation();

                if (isUserOpen) {
                    closeUserDropdown();
                } else {
                    openUserDropdown();
                }
            });
        }

        // Close on outside click
        document.addEventListener('click', function (e) {
            if (
                isOpen &&
                !dropdown.contains(e.target) &&
                !bellBtn.contains(e.target)
            ) {
                closeDropdown();
            }

            if (
                isUserOpen &&
                !userDropdown.contains(e.target) &&
                !userBtn.contains(e.target)
            ) {
                closeUserDropdown();
            }
        });

        // Close on Escape
        document.addEventListener('keydown', function (e) {

            if (e.key === 'Escape') {
                if (isOpen) {
                    closeDropdown();
                }
                if (isUserOpen) {
                    closeUserDropdown();
                }
            }
        });
    })();
</script>
