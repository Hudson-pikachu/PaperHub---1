<div id="register-modal"
    class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/40 backdrop-blur-sm px-4">
    <div class="relative w-full max-w-md">
        <!-- Close -->
        <button id="close-register-modal"
            class="absolute -top-12 right-0 text-white text-sm font-semibold hover:opacity-80 transition-all">
            Đóng
        </button>
        <!-- Register Card -->
        <div class="auth-card rounded-2xl p-6 md:p-8 shadow-sm bg-white">

            <!-- Title -->
            <div class="text-center mb-8">
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-[#1A365D]">
                    Tạo tài khoản
                </h1>
                <p class="text-sm md:text-base text-slate-500 mt-3">
                    Tham gia cộng đồng nghiên cứu cùng PaperHub
                </p>
            </div>

            <!-- Form -->
            <form class="space-y-5">
                <!-- Full Name -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        Username
                    </label>
                    <input type="text" placeholder="nguyenvanan"
                        class="auth-input w-full bg-white border border-slate-200 rounded-2xl px-4 py-3 text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        Email
                    </label>
                    <input type="email" placeholder="nguyenvanan@example.com"
                        class="auth-input w-full bg-white border border-slate-200 rounded-2xl px-4 py-3 text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        Mật khẩu
                    </label>
                    <input type="password" placeholder="••••••••"
                        class="auth-input w-full bg-white border border-slate-200 rounded-2xl px-4 py-3 text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        Xác nhận mật khẩu
                    </label>
                    <input type="password" placeholder="••••••••"
                        class="auth-input w-full bg-white border border-slate-200 rounded-2xl px-4 py-3 text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Register Button -->
                <button type="submit"
                    class="w-full bg-[#1A365D] text-white py-3 rounded-2xl text-sm md:text-base font-semibold tracking-wide hover:bg-[#2C5282] transition-all">
                    Đăng ký
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center gap-4 my-7">
                <div class="flex-1 h-px bg-slate-200"></div>
                <span class="text-xs text-slate-400 uppercase tracking-[0.2em]">
                    PaperHub
                </span>
                <div class="flex-1 h-px bg-slate-200"></div>
            </div>

            <!-- Login -->
            <p class="text-sm text-center text-slate-500">
                Đã có tài khoản?
                <button type="button" id="switch-to-login-modal"
                    class="text-[#1A365D] font-semibold hover:text-[#2C5282] transition-colors">
                    Đăng nhập
                </button>
            </p>
        </div>
    </div>
</div>
