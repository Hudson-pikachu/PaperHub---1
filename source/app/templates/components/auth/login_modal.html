<div id="login-modal"
    class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/40 backdrop-blur-sm px-4">
    <div class="relative w-full max-w-md">
        <!-- Close -->
        <button id="close-login-modal"
            class="absolute -top-12 right-0 text-white text-sm font-semibold hover:opacity-80 transition-all">
            Đóng
        </button>
        <!-- Login Card -->
        <div class="auth-card rounded-2xl p-6 md:p-8 shadow-sm bg-white">
            <!-- Title -->
            <div class="text-center mb-8">
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-[#1A365D]">
                    Chào mừng trở lại
                </h1>
                <p class="text-sm md:text-base text-slate-500 mt-3">
                    Đăng nhập để tiếp tục với PaperHub
                </p>
            </div>

            <!-- Error Message -->
            <div id="login-error"
                class="hidden mb-4 px-4 py-3 rounded-xl bg-red-50 border border-red-200 text-sm text-red-600">
            </div>

            <!-- Form -->
            <form id="login-form" class="space-y-5" novalidate>
                <!-- Email / Username -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        Email / Username
                    </label>
                    <input id="login-identifier" type="text" placeholder="you@example.com hoặc username"
                        class="auth-input w-full bg-white border border-slate-200 rounded-2xl px-4 py-3 text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        Mật khẩu
                    </label>
                    <input id="login-password" type="password" placeholder="••••••••"
                        class="auth-input w-full bg-white border border-slate-200 rounded-2xl px-4 py-3 text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Remember me -->
                <div class="flex items-center gap-2">
                    <input id="login-remember" type="checkbox"
                        class="w-4 h-4 rounded accent-[#1A365D] cursor-pointer">
                    <label for="login-remember" class="text-sm text-slate-600 cursor-pointer select-none">
                        Ghi nhớ đăng nhập
                    </label>
                </div>

                <!-- Login Button -->
                <button id="login-submit" type="submit"
                    class="w-full bg-[#1A365D] text-white py-3 rounded-2xl text-sm md:text-base font-semibold tracking-wide hover:bg-[#2C5282] transition-all disabled:opacity-60 disabled:cursor-not-allowed">
                    Đăng nhập
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center gap-4 my-7">
                <div class="flex-1 h-px bg-slate-200"></div>
                <span class="text-xs text-slate-400 uppercase tracking-[0.2em]">PaperHub</span>
                <div class="flex-1 h-px bg-slate-200"></div>
            </div>

            <!-- Register -->
            <p class="text-sm text-center text-slate-500">
                Chưa có tài khoản?
                <button type="button" id="switch-to-register-modal"
                    class="text-[#1A365D] font-semibold hover:text-[#2C5282] transition-colors">
                    Đăng ký
                </button>
            </p>
        </div>
    </div>
</div>
