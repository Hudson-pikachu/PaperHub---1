<article class="paper-card rounded-2xl p-5 md:p-6 shadow-sm relative">
    <span
        class="absolute top-0 right-0 bg-[#1A365D] text-white text-[10px] font-semibold px-3 py-1 rounded-tr-xl rounded-bl-xl shadow-sm">
        {{ paper.category_name }}
    </span>
    <div class="flex flex-col gap-3 pt-3 md:pt-0">
        <a href="/read/{{ paper.id }}" class="block">
            <h2
                class="text-lg md:text-xl font-bold leading-snug text-[#1A365D] hover:text-[#3182CE] transition-colors cursor-pointer">
                {{ paper.title }}
            </h2>
        </a>
        <div class="flex flex-wrap items-center gap-2 md:gap-4 text-xs text-slate-500">
            <span class="font-semibold text-slate-700">
                {{ paper.authors }}
            </span>
            <span>•</span>
            <span>{{ paper.published_date }}</span>
        </div>
        <div class="relative">
            <span class="text-xs font-bold text-[#1A365D] uppercase tracking-wider block mb-1">ABSTRACT</span>
            <p class="abstract-text text-slate-600 text-sm leading-7 border-l-2 border-slate-100 pl-4 overflow-hidden transition-all duration-300"
                style="max-height: 5.5rem;" aria-expanded="false">
                {{ paper.abstract }}
            </p>

            <!-- Overlay -->
            <div
                class="abstract-overlay absolute inset-x-0 bottom-0 h-14 bg-gradient-to-t from-white via-white/90 to-transparent flex items-end justify-center pb-2">
                <button type="button"
                    class="expand-btn inline-flex items-center gap-2 rounded-full bg-white border border-slate-200 px-4 py-2 text-xs font-semibold text-slate-700 shadow-sm hover:bg-slate-50 transition-all">
                    Xem thêm
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.24a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
            </div>

            <!-- Collapse -->
            <button type="button"
                class="collapse-btn hidden mt-3 text-sm font-semibold text-[#1A365D] hover:text-[#2C5282] transition-colors">
                Thu gọn
            </button>
        </div>

        {% if paper.ai_summary %}
        <div class="p-4 bg-blue-50 border border-blue-100 rounded-xl">
            <h4 class="text-[10px] font-bold text-[#3182CE] uppercase tracking-widest mb-1 flex items-center gap-1">
                <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                AI Tóm tắt
            </h4>
            <p class="text-slate-700 text-sm italic">
                {{ paper.ai_summary }}
            </p>
        </div>
        {% endif %}

        <div class="flex justify-between items-center pt-2">
            <span class="text-[10px] text-slate-400 font-mono">Nguồn: arXiv</span>
            <div class="flex items-center gap-2">
                <button type="button"
                    class="bookmark-btn inline-flex items-center justify-center text-xl transition-all {% if paper.id in saved_paper_ids %}bookmark-active text-[#1A365D]{% else %}text-slate-300{% endif %}"
                    data-paper-id="{{ paper.id }}" aria-label="Lưu bài nghiên cứu" title="Lưu bài nghiên cứu">
                    <svg class="w-7 h-7" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z" />
                    </svg>
                </button>
                <a href="/read/{{ paper.id }}"
                    class="px-4 py-2 bg-[#1A365D] text-white text-xs font-semibold rounded-xl hover:bg-[#2C5282] transition-all">
                    Đọc bài
                </a>
            </div>
        </div>
    </div>
</article>
