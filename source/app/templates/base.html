<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperHub</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon/favicon.ico') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body class="px-4 py-8 md:px-8 md:py-10">
    <div class="max-w-5xl mx-auto">
        <!-- User Header -->
        {% include 'components/header/user_header.html' %}

        {% block content %}
        {% endblock %}

        <!-- Footer -->
        {% include 'components/footer.html' %}
    </div>

    <!-- Login Modal -->
    {% include 'components/auth/login_modal.html' %}

    <!-- Register Modal -->
    {% include 'components/auth/register_modal.html' %}

    <!-- Back To Top -->
    <button id="back-to-top"
        class="fixed bottom-5 left-5 md:bottom-6 md:left-6 z-50 hidden items-center justify-center w-12 h-12 rounded-full bg-[#1A365D] text-white shadow-lg hover:bg-[#2C5282] hover:scale-105 transition-all duration-300">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
        </svg>
    </button>

    <script src="{{ url_for('static', filename='js/modal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dropdown.js') }}"></script>
    <script src="{{ url_for('static', filename='js/back-to-top.js') }}"></script>
    <script src="{{ url_for('static', filename='js/paper-expand.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
